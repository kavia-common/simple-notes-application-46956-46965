<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ocean Notes</title>
    <meta name="description" content="A simple notes app built with LightningJS and Vite" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --primary: #2563EB;
        --secondary: #F59E0B;
        --error: #EF4444;
        --bg: #f9fafb;
        --surface: #ffffff;
        --text: #111827;
        --border: #E5E7EB;
      }
      html, body, #app {
        height: 100%;
      }
      html, body, * {
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      }
      * {
        box-sizing: border-box;
      }
      button {
        font-family: inherit;
      }
      input, textarea {
        font-family: inherit;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
